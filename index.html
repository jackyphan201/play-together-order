<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🌿 Theo Dõi Đơn Hàng</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  /* ===== CSS VARIABLES ===== */
  :root {
    --bg: #0f1a14;
    --surface: #162019;
    --card: #1c2a20;
    --border: #2a3d2e;
    --accent: #4ade80;
    --accent-dim: #22c55e55;
    --accent2: #f59e0b;
    --text: #e2f0e6;
    --text-muted: #7a9e82;
    --danger: #f87171;
    --danger-dim: #f8717133;
    --radius: 12px;
    --shadow: 0 4px 24px #00000060;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }

  /* ===== HEADER ===== */
  header {
    text-align: center;
    margin-bottom: 32px;
  }
  header h1 {
    font-family: 'Space Mono', monospace;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    color: var(--accent);
    letter-spacing: -1px;
    text-shadow: 0 0 24px var(--accent-dim);
  }
  header p {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-top: 4px;
  }

  /* ===== LAYOUT ===== */
  .container { max-width: 900px; margin: 0 auto; }

  section { margin-bottom: 32px; }
  section > h2 {
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--text-muted);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  section > h2::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ===== TOTALS GRID ===== */
  #totals-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px;
  }
  .total-chip {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    transition: border-color 0.2s;
  }
  .total-chip.has-qty { border-color: var(--accent); }
  .total-chip .chip-name {
    font-size: 0.78rem;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .total-chip .chip-qty {
    font-family: 'Space Mono', monospace;
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--accent);
  }
  .total-chip.has-qty .chip-qty { text-shadow: 0 0 12px var(--accent-dim); }

  /* ===== ORDER CARDS ===== */
  #orders-list { display: flex; flex-direction: column; gap: 12px; }

  .order-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: opacity 0.3s, border-color 0.3s;
    box-shadow: var(--shadow);
  }
  .order-card.excluded { opacity: 0.5; }
  .order-card.excluded .card-header { border-bottom-color: var(--border); }

  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: #1f2f24;
  }
  .card-title {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 1rem;
    color: var(--accent);
    flex: 1;
  }
  .card-controls { display: flex; align-items: center; gap: 10px; }

  /* Checkbox toggle */
  .include-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    color: var(--text-muted);
    cursor: pointer;
    user-select: none;
  }
  .include-label input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }

  /* Icon buttons */
  .btn-icon {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    cursor: pointer;
    padding: 5px 9px;
    font-size: 0.85rem;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .btn-icon:hover { background: var(--border); color: var(--text); }
  .btn-icon.danger:hover { background: var(--danger-dim); border-color: var(--danger); color: var(--danger); }

  /* Product lines inside card */
  .card-body { padding: 12px 16px; }
  .product-line {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.88rem;
    flex-wrap: wrap;
  }
  .product-line:last-child { border-bottom: none; }
  .line-product { font-weight: 700; color: var(--text); }
  .line-qty {
    font-family: 'Space Mono', monospace;
    color: var(--accent);
    background: var(--accent-dim);
    border-radius: 4px;
    padding: 1px 7px;
    font-size: 0.82rem;
  }
  .line-mutation {
    color: var(--accent2);
    font-size: 0.78rem;
    background: #f59e0b18;
    border: 1px solid #f59e0b44;
    border-radius: 4px;
    padding: 1px 7px;
  }
  .empty-order { color: var(--text-muted); font-size: 0.85rem; font-style: italic; }

  /* ===== ADD BUTTON ===== */
  #add-order-btn {
    position: fixed;
    bottom: 28px;
    right: 28px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    color: #0a1a0d;
    border: none;
    font-size: 1.8rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px var(--accent-dim);
    transition: transform 0.15s, box-shadow 0.15s;
    z-index: 100;
    line-height: 1;
  }
  #add-order-btn:hover { transform: scale(1.1); box-shadow: 0 6px 28px #4ade8088; }

  /* ===== MODAL ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #00000099;
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: 100%;
    max-width: 600px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 12px 48px #00000090;
  }
  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
  }
  .modal-header h3 {
    font-family: 'Space Mono', monospace;
    color: var(--accent);
    flex: 1;
    font-size: 1rem;
  }
  .modal-body {
    overflow-y: auto;
    flex: 1;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .modal-footer {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  /* Modal product line row */
  .modal-line {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .modal-line-row1 { display: flex; gap: 8px; align-items: center; }
  .modal-line-row2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  select, input[type=number] {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 7px 10px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.88rem;
    outline: none;
    transition: border-color 0.2s;
  }
  select:focus, input[type=number]:focus { border-color: var(--accent); }
  select { cursor: pointer; }
  select option { background: var(--card); }

  .select-product { flex: 1; min-width: 0; }
  .input-qty { width: 72px; }

  .mutation-check-label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.8rem;
    color: var(--text-muted);
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
  }
  .mutation-check-label input { accent-color: var(--accent2); cursor: pointer; }

  .select-mutation { flex: 1; min-width: 120px; }

  /* Buttons */
  .btn {
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-size: 0.88rem;
    font-weight: 700;
    padding: 8px 18px;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:hover { opacity: 0.85; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #0a1a0d; }
  .btn-secondary { background: var(--border); color: var(--text); }
  .btn-add-line {
    background: none;
    border: 1px dashed var(--border);
    border-radius: 8px;
    color: var(--text-muted);
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-size: 0.85rem;
    padding: 10px;
    text-align: center;
    transition: border-color 0.2s, color 0.2s;
    width: 100%;
  }
  .btn-add-line:hover { border-color: var(--accent); color: var(--accent); }

  .error-msg {
    color: var(--danger);
    font-size: 0.8rem;
    padding: 6px 0;
    display: none;
  }
  .error-msg.show { display: block; }

  /* Empty state */
  .empty-state {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.9rem;
    padding: 32px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 480px) {
    .modal-line-row1 { flex-wrap: wrap; }
    .select-product { min-width: 100%; }
  }
</style>
</head>
<body>

<header>
  <h1>🌿 Theo Dõi Đơn Hàng</h1>
  <p>Quản lý đơn thu thập nông sản</p>
</header>

<div class="container">
  <!-- TOTALS SECTION -->
  <section>
    <h2>Tổng cần</h2>
    <div id="totals-grid"></div>
  </section>

  <!-- ORDERS SECTION -->
  <section>
    <h2>Các đơn hàng</h2>
    <div id="orders-list">
      <div class="empty-state" id="empty-state">Chưa có đơn nào. Nhấn <strong>+</strong> để tạo đơn đầu tiên!</div>
    </div>
  </section>
</div>

<!-- FAB ADD BUTTON -->
<button id="add-order-btn" title="Tạo đơn mới">+</button>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h3 id="modal-title">Tạo đơn mới</h3>
    </div>
    <div class="modal-body" id="modal-body">
      <!-- Lines injected here -->
    </div>
    <p class="error-msg" id="modal-error" style="margin: 0 20px;"></p>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="modal-cancel">Hủy</button>
      <button class="btn btn-primary" id="modal-save">Lưu</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// DATA
// ============================================================

const PRODUCTS = [
  "Cà Rốt","Dâu Tây","Việt Quất","Nấm","Bắp","Cà Chua",
  "Xương Rồng","Táo","Nho","Bí Ngô","Dưa Hấu","Dừa",
  "Xoài","Đậu","Khế","Táo Đường","Rau Xà Lách","Rau Chân Vịt",
  "Chanh","Nhân Sâm","Sầu Riêng","Trái Sung"
];

const MUTATIONS = [
  "Ánh vàng","Cầu vồng","Ẩm ướt","Nhiễm điện","Gió","Cát",
  "Ánh trắng","Cực quang","Sương","Bướm","Khí lạnh","Băng",
  "Khô","Nguyền rủa","Đèn trời","Ảo ảnh","Pháo hoa"
];

// App state — no persistence, resets on refresh
let orders = [];       // Array of { id, name, included, lines: [{product, qty, mutation}] }
let nextId = 1;        // Incremental order counter
let editingId = null;  // null = new order, number = editing existing

// ============================================================
// TOTALS
// ============================================================

function computeTotals() {
  const totals = {};
  PRODUCTS.forEach(p => totals[p] = 0);
  orders
    .filter(o => o.included)
    .forEach(o => o.lines.forEach(l => {
      if (l.qty > 0) totals[l.product] = (totals[l.product] || 0) + l.qty;
    }));
  return totals;
}

function renderTotals() {
  const totals = computeTotals();
  const grid = document.getElementById('totals-grid');
  grid.innerHTML = '';
  PRODUCTS.forEach(p => {
    const qty = totals[p] || 0;
    const chip = document.createElement('div');
    chip.className = 'total-chip' + (qty > 0 ? ' has-qty' : '');
    chip.innerHTML = `<span class="chip-name" title="${p}">${p}</span><span class="chip-qty">${qty}</span>`;
    grid.appendChild(chip);
  });
}

// ============================================================
// ORDERS RENDER
// ============================================================

function renderOrders() {
  const list = document.getElementById('orders-list');
  const emptyState = document.getElementById('empty-state');

  // Clear existing cards (keep empty state node)
  [...list.querySelectorAll('.order-card')].forEach(el => el.remove());

  if (orders.length === 0) {
    emptyState.style.display = '';
    return;
  }
  emptyState.style.display = 'none';

  orders.forEach(order => {
    const card = document.createElement('div');
    card.className = 'order-card' + (order.included ? '' : ' excluded');
    card.dataset.id = order.id;

    // Header
    const header = document.createElement('div');
    header.className = 'card-header';
    header.innerHTML = `
      <span class="card-title">${order.name}</span>
      <div class="card-controls">
        <label class="include-label" title="Tính vào tổng">
          <input type="checkbox" class="include-cb" ${order.included ? 'checked' : ''}/>
          Tính vào tổng
        </label>
        <button class="btn-icon edit-btn" title="Chỉnh sửa">✏️</button>
        <button class="btn-icon danger delete-btn" title="Xóa đơn">🗑</button>
      </div>
    `;

    // Body
    const body = document.createElement('div');
    body.className = 'card-body';
    if (order.lines.length === 0) {
      body.innerHTML = '<span class="empty-order">Đơn trống</span>';
    } else {
      order.lines.forEach(l => {
        const row = document.createElement('div');
        row.className = 'product-line';
        row.innerHTML = `
          <span class="line-product">${l.product}</span>
          <span class="line-qty">×${l.qty}</span>
          ${l.mutation ? `<span class="line-mutation">✨ ${l.mutation}</span>` : ''}
        `;
        body.appendChild(row);
      });
    }

    card.appendChild(header);
    card.appendChild(body);
    list.appendChild(card);

    // Events
    header.querySelector('.include-cb').addEventListener('change', e => {
      order.included = e.target.checked;
      card.classList.toggle('excluded', !order.included);
      renderTotals();
    });
    header.querySelector('.edit-btn').addEventListener('click', () => openModal(order.id));
    header.querySelector('.delete-btn').addEventListener('click', () => {
      if (confirm(`Xóa "${order.name}"?`)) {
        orders = orders.filter(o => o.id !== order.id);
        renderOrders();
        renderTotals();
      }
    });
  });
}

// ============================================================
// MODAL
// ============================================================

function openModal(orderId = null) {
  editingId = orderId;
  const overlay = document.getElementById('modal-overlay');
  const body = document.getElementById('modal-body');
  const title = document.getElementById('modal-title');

  body.innerHTML = '';
  hideError();

  if (orderId !== null) {
    const order = orders.find(o => o.id === orderId);
    title.textContent = `Chỉnh sửa ${order.name}`;
    // Populate existing lines
    order.lines.forEach(l => addModalLine(l));
  } else {
    title.textContent = 'Tạo đơn mới';
    addModalLine(); // start with one empty line
  }

  // Add-line button
  const addLineBtn = document.createElement('button');
  addLineBtn.className = 'btn-add-line';
  addLineBtn.id = 'add-line-btn';
  addLineBtn.textContent = '+ Thêm sản phẩm';
  addLineBtn.addEventListener('click', () => {
    body.insertBefore(createModalLine(), addLineBtn);
  });
  body.appendChild(addLineBtn);

  overlay.classList.add('open');
}

function addModalLine(data = null) {
  const body = document.getElementById('modal-body');
  const addBtn = document.getElementById('add-line-btn');
  const line = createModalLine(data);
  if (addBtn) {
    body.insertBefore(line, addBtn);
  } else {
    body.appendChild(line);
  }
}

function createModalLine(data = null) {
  const wrapper = document.createElement('div');
  wrapper.className = 'modal-line';

  // Row 1: product select + qty input + remove
  const row1 = document.createElement('div');
  row1.className = 'modal-line-row1';

  const productSel = document.createElement('select');
  productSel.className = 'select-product';
  PRODUCTS.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p;
    productSel.appendChild(opt);
  });
  if (data) productSel.value = data.product;

  const qtyInput = document.createElement('input');
  qtyInput.type = 'number';
  qtyInput.className = 'input-qty';
  qtyInput.min = 0;
  qtyInput.value = data ? data.qty : 1;
  qtyInput.placeholder = 'SL';

  const removeBtn = document.createElement('button');
  removeBtn.className = 'btn-icon danger';
  removeBtn.textContent = '×';
  removeBtn.title = 'Xóa dòng';
  removeBtn.addEventListener('click', () => wrapper.remove());

  row1.appendChild(productSel);
  row1.appendChild(qtyInput);
  row1.appendChild(removeBtn);

  // Row 2: mutation checkbox + dropdown
  const row2 = document.createElement('div');
  row2.className = 'modal-line-row2';

  const mutLabel = document.createElement('label');
  mutLabel.className = 'mutation-check-label';

  const mutCheck = document.createElement('input');
  mutCheck.type = 'checkbox';
  if (data && data.mutation) mutCheck.checked = true;
  mutLabel.appendChild(mutCheck);
  mutLabel.appendChild(document.createTextNode(' Có đột biến?'));

  const mutSel = document.createElement('select');
  mutSel.className = 'select-mutation';
  MUTATIONS.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    mutSel.appendChild(opt);
  });
  if (data && data.mutation) mutSel.value = data.mutation;

  // Toggle mutation dropdown visibility
  function syncMutVis() {
    mutSel.style.display = mutCheck.checked ? '' : 'none';
  }
  mutCheck.addEventListener('change', syncMutVis);
  syncMutVis();

  row2.appendChild(mutLabel);
  row2.appendChild(mutSel);

  wrapper.appendChild(row1);
  wrapper.appendChild(row2);

  // Expose data getter on element
  wrapper._getData = () => ({
    product: productSel.value,
    qty: parseInt(qtyInput.value) || 0,
    mutation: mutCheck.checked ? mutSel.value : null
  });

  return wrapper;
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editingId = null;
}

function showError(msg) {
  const el = document.getElementById('modal-error');
  el.textContent = msg;
  el.classList.add('show');
}
function hideError() {
  document.getElementById('modal-error').classList.remove('show');
}

function saveModal() {
  const body = document.getElementById('modal-body');
  const lineEls = [...body.querySelectorAll('.modal-line')];

  if (lineEls.length === 0) {
    showError('Đơn cần ít nhất một sản phẩm.');
    return;
  }

  const lines = lineEls.map(el => el._getData());

  // DUPLICATE CHECK: block duplicates, show error
  // If user selects same product twice → show error and don't save
  const products = lines.map(l => l.product);
  const unique = new Set(products);
  if (unique.size !== products.length) {
    showError('Trùng sản phẩm trong đơn! Mỗi sản phẩm chỉ được thêm một lần.');
    return;
  }

  hideError();

  if (editingId !== null) {
    // Update existing order
    const order = orders.find(o => o.id === editingId);
    order.lines = lines;
  } else {
    // Create new order
    orders.push({
      id: nextId,
      name: `Đơn #${nextId}`,
      included: true,
      lines
    });
    nextId++;
  }

  closeModal();
  renderOrders();
  renderTotals();
}

// ============================================================
// EVENT LISTENERS
// ============================================================

document.getElementById('add-order-btn').addEventListener('click', () => openModal());
document.getElementById('modal-cancel').addEventListener('click', closeModal);
document.getElementById('modal-save').addEventListener('click', saveModal);

// Close on overlay click
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// ESC closes modal
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ============================================================
// INIT
// ============================================================
renderTotals();
renderOrders();
</script>
</body>
</html>
